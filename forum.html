<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forum</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <header>
        <nav>
            <a class="logo" href="index.html">#17lommel</a>
            <ul>
                <li><a href="reader.html">Sylvie</a></li>
                <li><a href="vertel.html">Vertelpagina</a></li>
                <li><a href="forum.html">Forum</a></li>
                <li><a href="echos.html">De Echo's</a></li>
                <li><a href="partners.html">Partners</a></li>
            </ul>
        </nav>
    </header>    

    <main>
        <h1>Forum</h1>
        <p>Heb je een vraag of wil je je verhaal delen? Laat het hier weten.</p>

        <section id="contact">
            <form id="infoForm">
                <label for="name">Naam:</label>
                <input type="text" id="name" name="name" required>
        
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required>
        
                <label for="message">Uw bericht:</label>
                <textarea id="message" name="message" rows="5" required></textarea>
        
                <button type="submit">Verzenden</button>
                <p id="status"></p>
            </form>
        </section>        
    </main>

    <script>
        document.getElementById("infoForm").addEventListener("submit", async function(event) {
            event.preventDefault();

            let formData = new FormData(this);
            let response = await fetch("https://formspree.io/f/xovelral", {
                method: "POST",
                body: formData,
                headers: { "Accept": "application/json" }
            });

            let result = await response.json();
            if (result.ok) {
                document.getElementById("status").innerText = "E-mail succesvol verzonden!";
                this.reset();
            } else {
                document.getElementById("status").innerText = "Fout bij verzenden.";
            }
        });
    </script>

    <script src="js/script.js"></script>
</body>
</html>
